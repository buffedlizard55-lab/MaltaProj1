name: Picks source probe (cc8f4dca)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: winboard-collect-cc8f4dca
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: arena/cc8f4dca-maltaproj1
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect Pinnacle public moneylines
        run: python3 scripts/winboard_pinnacle.py
      - name: Probe every candidate primary source
        run: |
          python3 scripts/winboard_probe.py || true
          python3 scripts/winboard_collect.py
      - name: Preserve raw evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: winboard-raw-${{ github.run_id }}
          path: winboard/raw/
          retention-days: 7
      - name: Rebuild and verify the dashboard, then commit only if it verifies
        run: |
          python3 scripts/vrs_snapshot.py
          python3 scripts/build_winboard.py
          python3 scripts/verify_winboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add winboard/data/ winboard/index.html winboard/methodology.html winboard/sources.html winboard/flagged.html winboard/assets/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data(cc8f4dca): verified refresh from run ${{ github.run_id }}"
          git pull --rebase origin arena/cc8f4dca-maltaproj1
          git push origin HEAD:arena/cc8f4dca-maltaproj1
      - name: Publish run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path('winboard/raw/probe.json')
          if not path.exists():
              print('Probe produced no report.')
          else:
              data = json.loads(path.read_text())
              print('## Source probe — started', data['started_utc'])
              print('| Source | HTTP | Bytes | SHA-256 (first 12) |')
              print('|---|---|---|---|')
              for row in data['sources']:
                  print(f"| [{row['name']}]({row['url']}) | {row['http_status']} | {row['bytes']} | `{row['sha256'][:12]}` |")
          PY
