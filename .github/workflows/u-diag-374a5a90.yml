# Diagnostic workflow for session arena/374a5a90 (U-01).
# Reproduces the model-91eff436.yml pipeline on GitHub's runner (which has internet access),
# captures the full step logs, and commits them under reviews/u374a5a90-diag/ on the branch it
# runs from so the failure evidence is readable via git (the Actions log blob host is not
# reachable from the session sandbox). On test failure it also emits ::error:: annotations
# carrying the failing tail. Scope: this file and reviews/u374a5a90-diag/** only.
name: U-01 model pipeline diagnostic (374a5a90)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run pipeline + tests, capture logs
        run: |
          set +e
          mkdir -p reviews/u374a5a90-diag
          LOG=reviews/u374a5a90-diag/pipeline_log.txt
          : > "$LOG"
          step() {
            echo "=== $1 ===" | tee -a "$LOG"
            shift
            "$@" >>"$LOG" 2>&1
            rc=$?
            echo "--- exit code: $rc ---" | tee -a "$LOG"
            return $rc
          }
          step "Fetch official inputs" python3 model/fetch.py
          step "Clone Valve VRS" git clone -q --depth 1 https://github.com/ValveSoftware/counter-strike_regional_standings.git /tmp/vrs
          step "Calibrate slope" env VRS_REPO_DIR=/tmp/vrs python3 model/calibrate.py
          step "Cross-check" bash -c "python3 model/build.py >/dev/null && python3 model/crosscheck.py"
          step "Build own lines + page" python3 model/build.py
          step "Tests" env VRS_REPO_DIR=/tmp/vrs python3 model/test_model.py -v
          TEST_RC=$?
          echo "=== fixture snapshot summary ===" >>"$LOG"
          python3 -c "import json; fx=json.load(open('model/input/hotspawn_cs2_fixtures.json')); print('fetched_utc:', fx.get('fetched_utc')); print('fixture_count:', fx.get('fixture_count')); print('week:', fx.get('pickem_week')); print('missing lock_time:', [f['id'] for f in fx['fixtures'] if not f.get('lock_time')])" >>"$LOG" 2>&1
          date -u +"diag run finished %Y-%m-%dT%H:%M:%SZ" | tee -a "$LOG"
          echo "TEST_RC=$TEST_RC" | tee -a "$LOG"
          if [ "$TEST_RC" != "0" ]; then
            tail -n 30 "$LOG" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::diag: $line"
            done
          fi
          exit 0
      - name: Commit diagnostic log (evidence channel)
        run: |
          git config user.name "u-diag-374a5a90[bot]"
          git config user.email "u-diag-374a5a90@users.noreply.github.com"
          git add reviews/u374a5a90-diag/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "diag(374a5a90): model pipeline diagnostic log [run ${GITHUB_RUN_ID}]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
