name: Probe public sources (read-only)

on:
  push:
    branches: [arena/79a1c6c8-maltaproj1]
    paths:
      - pipeline/probe.py
      - .github/workflows/probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maltaproj1-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public pages
        run: python pipeline/probe.py
      # Raw bodies stay out of Git; they are evidence artifacts for human review.
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-raw-${{ github.run_id }}
          path: |
            pipeline/probe/raw/
            pipeline/probe/summary.json
          retention-days: 7
      - name: Commit summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/probe/summary.json
          if git diff --cached --quiet; then echo "no summary change"; else
            git commit -m "probe: record public source reachability summary [run ${{ github.run_id }}]"
            git push
          fi
