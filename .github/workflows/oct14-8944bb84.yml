name: Oct14 CS2 Board Refresh & Verification (8944bb84)

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [ main, 'arena/8944bb84-maltaproj1' ]
    paths:
      - 'scripts/8944bb84_build.py'
      - 'tests/test_8944bb84.py'
      - 'data/8944bb84/**'
      - 'oct14/**'
      - '.github/workflows/oct14-8944bb84.yml'
  pull_request:
    paths:
      - 'scripts/8944bb84_build.py'
      - 'tests/test_8944bb84.py'
      - 'data/8944bb84/**'
      - 'oct14/**'
      - '.github/workflows/oct14-8944bb84.yml'

permissions:
  contents: write

concurrency:
  group: oct14-8944bb84-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Oct14 CS2 dataset and dashboard with live check
        run: python3 scripts/8944bb84_build.py --live-check

      - name: Run 8944bb84 unit and verification suite
        run: python3 -m unittest tests/test_8944bb84.py -v

      - name: Run repository-wide HTML link and DOM fragment audit
        run: python3 scripts/audit_91e444dd.py --output /tmp/audit-8944bb84.json

      - name: Commit and push updated snapshot on scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/8944bb84 oct14
          if ! git diff --cached --quiet; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git commit -m "oct14(8944bb84): automated CS2 Pick'em verification refresh"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
