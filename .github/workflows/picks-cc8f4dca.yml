name: Picks source probe (cc8f4dca)

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches: [arena/cc8f4dca-maltaproj1]
    paths:
      - scripts/picks_probe.py
      - scripts/picks_collect.py
      - .github/workflows/picks-cc8f4dca.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: picks-probe-cc8f4dca
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: arena/cc8f4dca-maltaproj1
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Probe every candidate primary source
        run: python3 scripts/picks_probe.py
      - name: Preserve raw evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: picks-raw-${{ github.run_id }}
          path: picks/raw/
          retention-days: 7
      - name: Return the probe report to this session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks/data/probe.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data(cc8f4dca): source probe report from run ${{ github.run_id }}"
          git pull --rebase origin arena/cc8f4dca-maltaproj1
          git push origin HEAD:arena/cc8f4dca-maltaproj1
      - name: Publish run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path('picks/raw/probe.json')
          if not path.exists():
              print('Probe produced no report.')
          else:
              data = json.loads(path.read_text())
              print('## Source probe — started', data['started_utc'])
              print('| Source | HTTP | Bytes | SHA-256 (first 12) |')
              print('|---|---|---|---|')
              for row in data['sources']:
                  print(f"| [{row['name']}]({row['url']}) | {row['http_status']} | {row['bytes']} | `{row['sha256'][:12]}` |")
          PY
