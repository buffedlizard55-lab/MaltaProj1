# Diagnostic workflow for session arena/a1db82b7 (task M-01) — evidence-only.
#
# The scheduled own-line model run 38489574648 on `main` (2026-10-14T00:20:08Z) failed in its "Tests"
# step. The agent sandbox cannot reach the live sources, while Actions runners can, so this job re-runs
# the model pipeline exactly as the scheduled job does and commits the captured output under diag/,
# where it can be read from the repository. It writes nothing under model/ back to any branch.
#
# The work tree is restored to HEAD before publishing (the pipeline dirties model/); a dirty tree is what
# made the first version of this job fail to pull --rebase and lose its evidence (run 38497261693).
# Delete this file once M-01 is closed.
name: Diag (a1db82b7) model-test failure

on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a1db82b7-maltaproj1"]
    paths:
      - ".github/workflows/diag-a1db82b7.yml"

permissions:
  contents: write

concurrency:
  group: diag-a1db82b7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diag directory
        run: mkdir -p diag

      - name: "1: fetch official inputs (exactly as the scheduled job)"
        run: |
          set +e
          python3 model/fetch.py > diag/01_fetch.log 2>&1
          echo "FETCH_EXIT=$?" >> diag/01_fetch.log
          echo "--- model/input/fetch_log.json ---" >> diag/01_fetch.log
          cat model/input/fetch_log.json >> diag/01_fetch.log 2>&1
          cp -f model/input/fetch_log.json diag/06_fetch_log.json 2>/dev/null || true

      - name: "2: clone Valve's official standings repo + calibrate"
        run: |
          set +e
          {
            echo "--- Valve repo HEAD ---"
            rm -rf /tmp/vrs
            git clone -q --depth 1 https://github.com/ValveSoftware/counter-strike_regional_standings.git /tmp/vrs
            ( cd /tmp/vrs && git rev-parse HEAD && git log -1 --format='%ci %s' && ls live/2026/ | tail -6 )
            echo "--- calibrate.py ---"
            VRS_REPO_DIR=/tmp/vrs python3 model/calibrate.py
            echo "CALIBRATE_EXIT=$?"
            echo "--- model/input/vrs/meta.json ---"
            cat model/input/vrs/meta.json
          } > diag/02_vrs.log 2>&1
          cp -f model/input/vrs/meta.json diag/07_vrs_meta.json 2>/dev/null || true

      - name: "3: build own lines + page"
        run: |
          set +e
          python3 model/build.py > diag/03_build.log 2>&1
          echo "BUILD_EXIT=$?" >> diag/03_build.log

      - name: "4: tests, verbose (the step that fails in the scheduled run)"
        run: |
          set +e
          VRS_REPO_DIR=/tmp/vrs python3 model/test_model.py -v > diag/04_tests.log 2>&1
          code=$?
          echo "TEST_EXIT=$code" >> diag/04_tests.log
          echo "TEST_EXIT=$code"

      - name: "5: what the fresh inputs changed against the committed snapshot"
        run: |
          set +e
          {
            echo "--- git status --porcelain ---"
            git status --porcelain
            echo "--- git diff --stat ---"
            git diff --stat
            echo "--- fixtures now vs fixtures in the committed lines.csv ---"
            python3 - <<'PY'
            import csv, json, pathlib
            fx = json.loads(pathlib.Path("model/input/hotspawn_cs2_fixtures.json").read_text())
            rows = list(csv.DictReader(open("model/data/lines.csv", encoding="utf-8")))
            now = {}
            for f in fx["fixtures"]:
                now[str(f["id"])] = (f.get("participants0_name"), f.get("participants1_name"),
                                     f.get("lock_time"), f.get("scheduled_start_time"))
            pub = {r["hotspawn_match_id"]: (r["team_a"], r["team_b"], r["section"], r["actionable"])
                   for r in rows}
            print(f"payload fixtures: {len(now)}   published rows: {len(pub)}")
            print(f"payload fetched_utc: {fx.get('fetched_utc')}  (committed snapshot: {fx.get('snapshot_of')})")
            print("--- in payload, not published ---")
            for k in sorted(set(now) - set(pub)):
                print(" ", k, now[k])
            print("--- published, not in payload ---")
            for k in sorted(set(pub) - set(now)):
                print(" ", k, pub[k])
            print("--- row-level name/status differences ---")
            for k in sorted(set(now) & set(pub)):
                a, b = now[k], pub[k]
                if (a[0], a[1]) != (b[0], b[1]):
                    print("  NAME", k, "payload:", a[:2], "published:", b[:2])
            blanks = [r["hotspawn_match_id"] for r in rows if r["line_status"] != "OWN LINE"]
            print(f"rows without an own line: {len(blanks)}: {blanks}")
            PY
            echo "--- git diff -- model/data/lines.csv (first 300 lines) ---"
            git diff -- model/data/lines.csv | head -300
            echo "--- git diff -- model/data/teams.csv (first 150 lines) ---"
            git diff -- model/data/teams.csv | head -150
          } > diag/05_changed.log 2>&1

      - name: "6: publish diag evidence on this branch"
        if: always()
        run: |
          git config user.name "diag-a1db82b7[bot]"
          git config user.email "diag-a1db82b7@users.noreply.github.com"
          # restore a clean tree so pull --rebase cannot refuse (this is what broke run 38497261693)
          git checkout -- model/ 2>/dev/null || true
          git clean -fdq model/ 2>/dev/null || true
          git add -f diag/
          git status --porcelain | head -30
          if git diff --cached --quiet; then
            echo "no diag change to publish"; exit 0
          fi
          git commit -q -m "diag(a1db82b7): model-test diagnosis from run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "diag evidence pushed"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push diag evidence"; exit 1

      - name: "7: fail the job if the model tests failed (so the run status is honest)"
        if: always()
        run: |
          code=$(grep -o 'TEST_EXIT=[0-9]*' diag/04_tests.log | tail -1 | cut -d= -f2)
          echo "model tests exit code: ${code:-unknown}"
          test "${code:-1}" = "0"
