# Executive-summary board — session arena/bdc98a9a (tasks E-01..E-03).
#
# What it does, with no credentials, no account and no manual input:
#   1. Reads the public sources: Hotspawn Play /lobby and /cs2-pickems (fixture list from the
#      server-rendered Angular `script#ng-state` payload), Valve's published Regional Standings,
#      HLTV's World Ranking plus the per-match pages of the fixtures that are listed, and the public
#      bookmaker pages other sessions capture. Hotspawn crowd percentages are never read.
#   2. Merges that with the evidence the repo already holds (slate/, live/, cs2/, oct14/ datasets are
#      read-only inputs) and originates a probability + pick for every open CS2 fixture.
#   3. Rebuilds exec/ and runs this board's tests plus a repository-wide local link audit.
#   4. Commits exec/ back to the branch the run started from, so the published board keeps refreshing
#      itself after merge, and asks for a Pages build on main.
# A live-source refusal is recorded on the sources page and the board keeps publishing the last
# committed evidence; a failed test or a broken link blocks the commit entirely.
name: Executive summary board (bdc98a9a)

on:
  workflow_dispatch: {}
  push:
    branches: ["arena/bdc98a9a-maltaproj1", "main"]
    paths:
      - "exec/**"
      - "scripts/exec_bdc98a9a_build.py"
      - "tests/test_exec_bdc98a9a.py"
      - ".github/workflows/exec-bdc98a9a.yml"
  schedule:
    # Hourly at :17. GitHub schedules are best-effort and can be delayed; the run itself stamps the
    # capture time on every row so a delayed run is visible rather than silent.
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: exec-bdc98a9a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the browser used for the public source pages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read the live public sources (best effort, recorded)
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          python exec/collect.py 2>&1 | tee exec/data/live/collect.log

      - name: Build the executive-summary board
        run: |
          set -o pipefail
          python scripts/exec_bdc98a9a_build.py 2>&1 | tee exec/data/build.log

      - name: Board tests (coverage, math, sources, policy, pages)
        run: python -m unittest tests.test_exec_bdc98a9a -v

      - name: Repository-wide local link audit
        run: |
          python - <<'PY' | tee exec/data/link_audit.log
          import re, sys
          from pathlib import Path
          root = Path('.')
          pages = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          broken, checked = [], 0
          for page in pages:
              text = page.read_text(encoding='utf-8', errors='replace')
              for href in re.findall(r'href="([^"#?]+)"', text):
                  if href.startswith(('http://', 'https://', 'mailto:', 'javascript:', '//')):
                      continue
                  if not href.strip():
                      continue
                  # Skip links that are assembled in client-side JavaScript rather than written
                  # into the markup (e.g. href="'+m.source_url+'"): those are not static targets.
                  if not re.fullmatch(r"[A-Za-z0-9_./%\-]+", href):
                      continue
                  target = (page.parent / href.split('#')[0].split('?')[0]).resolve()
                  checked += 1
                  if not target.exists():
                      broken.append(f'{page} -> {href}')
          print(f'link audit: {len(pages)} pages, {checked} local links, {len(broken)} broken')
          for item in broken:
              print('  BROKEN', item)
          sys.exit(1 if broken else 0)
          PY

      - name: Commit the validated board back to this branch
        run: |
          git config user.name "arena-bdc98a9a"
          git config user.email "arena-bdc98a9a@users.noreply.github.com"
          git add exec/
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "exec(bdc98a9a): executive-summary board rebuild from run ${GITHUB_RUN_ID}"
            git pull --rebase=merges origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Request Pages build for a successful main refresh
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Confirm the public page really serves the new capture
        if: success() && github.ref_name == 'main'
        run: |
          set -o pipefail
          python - <<'PY'
          import json, sys, urllib.request
          base = "https://buffedlizard55-lab.github.io/MaltaProj1/exec/"
          want = json.load(open("exec/data/summary.json"))["generated_utc"]
          req = urllib.request.Request(base + "data/summary.json",
                                       headers={"User-Agent": "arena-bdc98a9a-pages-check"})
          body = urllib.request.urlopen(req, timeout=30).read().decode()
          live = json.loads(body)["generated_utc"]
          print(f"live summary generated_utc={live} (run produced {want})")
          for page in ("index.html", "picks.html", "coverage.html", "flagged.html"):
              code = urllib.request.urlopen(urllib.request.Request(
                  base + page, headers={"User-Agent": "arena-bdc98a9a-pages-check"}),
                  timeout=30).status
              print(f"  {page}: HTTP {code}")
              if code != 200:
                  sys.exit(1)
          PY

      - name: Upload the capture, logs and data as an artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: exec-board-${{ github.run_id }}
          path: |
            exec/data/
            exec/*.html
          retention-days: 14
