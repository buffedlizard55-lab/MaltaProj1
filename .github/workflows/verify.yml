name: Verify evidence dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/4f599d7c-maltaproj1]
    paths:
      - collector/**
      - webui/**
      - dashboard/**
      - data/snapshot/**
      - tests/test_*.py
      - scripts/build_site.py
      - scripts/validate.py
      - .github/workflows/verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check strict math, source fields, privacy and empty states
        run: python -m unittest discover -s tests -v
      - name: Check real primary evidence and every internal link
        run: |
          python scripts/build_site.py
          python scripts/validate.py
          node --check webui/dashboard.js
          python -m py_compile collector/*.py scripts/collect.py scripts/build_site.py scripts/validate.py
