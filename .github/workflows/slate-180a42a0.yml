# Slate capture + rebuild — session arena/180a42a0 (S-01..S-04, S-06).
#
# What it does, with no credentials and no manual input:
#   1. Reads the public Hotspawn Play pick'em pages (/lobby, /cs2-pickems, /thp-pickems,
#      /lol-pickems) and parses the server-rendered ng-state payload for the authoritative fixture
#      list with exact UTC lock/start epochs.
#   2. Reads the public rating sources (HLTV ranking page, Valve Regional Standings file) and this
#      project's own line is originated from them; reads external bookmaker prices from Pinnacle's
#      public guest responses and EGamersWorld's public match pages where they are served.
#   3. Rebuilds the site pages under slate/ and commits data + pages back to the branch the run
#      started from (this session's branch while work is in progress, main once merged, so the
#      published board keeps refreshing itself).
# Every fetch is logged with its status and SHA-256 in slate/data/provenance.json; a source that
# refuses to serve a page is recorded as a refusal, never filled in with a guess.
name: Slate capture (180a42a0)

on:
  workflow_dispatch: {}
  push:
    branches: ["arena/180a42a0-maltaproj1", "main"]
    paths:
      - "slate/collect.py"
      - "slate/build.py"
      - "slate/aliases.json"
      - ".github/workflows/slate-180a42a0.yml"
  schedule:
    # Every three hours, staggered against the other refreshers in this repository.
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: slate-180a42a0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser used for the public bookmaker pages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture slate, ratings and external lines
        run: python slate/collect.py

      - name: Rebuild the dashboard pages
        run: python slate/build.py

      - name: Run the offline tests
        run: python slate/tests.py

      - name: Commit data and pages back to this branch
        if: always()
        run: |
          git config user.name "arena-180a42a0"
          git config user.email "arena-180a42a0@users.noreply.github.com"
          git add slate/
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "slate(180a42a0): capture + rebuild from run ${GITHUB_RUN_ID}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload the capture log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slate-capture-${{ github.run_id }}
          path: |
            slate/data/analysis.json
            slate/data/provenance.json
            slate/data/flags.csv
          retention-days: 14
