# Slate capture + rebuild — session arena/180a42a0 (S-01..S-04, S-06).
#
# What it does, with no credentials and no manual input:
#   1. Reads the public Hotspawn Play pick'em pages (/lobby, /cs2-pickems, /thp-pickems,
#      /lol-pickems) and parses the server-rendered ng-state payload for the authoritative fixture
#      list with exact UTC lock/start epochs.
#   2. Reads the public rating sources (HLTV ranking page, Valve Regional Standings file) and this
#      project's own line is originated from them; reads external bookmaker prices from Pinnacle's
#      public guest responses and EGamersWorld's public match pages where they are served.
#   3. Rebuilds the site pages under slate/ and commits data + pages back to the branch the run
#      started from (this session's branch while work is in progress, main once merged, so the
#      published board keeps refreshing itself).
# Every fetch is logged with its status and SHA-256 in slate/data/provenance.json; a source that
# refuses to serve a page is recorded as a refusal, never filled in with a guess.
name: Slate capture (180a42a0)

on:
  workflow_dispatch: {}
  push:
    branches: ["arena/a9a0c2f1-maltaproj1", "main"]
    paths:
      - "slate/collect.py"
      - "slate/build.py"
      - "slate/aliases.json"
      - "slate/guards.py"
      - "slate/tests.py"
      - "slate/dashboard.js"
      - ".github/workflows/slate-180a42a0.yml"
  schedule:
    # Hourly; GitHub schedules are best-effort and can be delayed.
    - cron: "41 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: slate-180a42a0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the browser used for the public bookmaker pages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Failed captures are artifacts only, never committed over the last good snapshot.
      # Commit step runs ONLY after collection, build and tests succeed.
      - name: Capture slate, ratings and external lines
        run: |
          set -o pipefail
          python slate/collect.py 2>&1 | tee slate/data/last_run.log

      - name: Rebuild the dashboard pages
        run: |
          set -o pipefail
          python slate/build.py 2>&1 | tee -a slate/data/last_run.log

      - name: Run the offline tests
        run: |
          set -o pipefail
          python slate/tests.py 2>&1 | tee -a slate/data/last_run.log

      - name: Check browser code
        run: node --check slate/dashboard.js

      - name: Commit validated data and pages back to this branch
        run: |
          git config user.name "arena-180a42a0"
          git config user.email "arena-180a42a0@users.noreply.github.com"
          git add slate/
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "slate(180a42a0): capture + rebuild from run ${GITHUB_RUN_ID}"
            # Never suppress a failed rebase, discard another session's edits, or publish partial data.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Request Pages build for successful main refresh
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Upload the capture log as an artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: slate-capture-${{ github.run_id }}
          path: |
            slate/data/last_run.log
            slate/data/analysis.json
            slate/data/provenance.json
            slate/data/flags.csv
          retention-days: 14
