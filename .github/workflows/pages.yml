name: Build and deploy odds dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Test dashboard and data contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install refresh dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate source rows and no-vig calculations
        run: python scripts/validate_snapshot.py
      - name: Check local page and asset links
        run: python scripts/check_site.py

  deploy:
    name: Refresh snapshot and publish Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install refresh dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh public fixtures and markets
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_snapshot.py
      - name: Record refresh fallback, if needed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "The public-source refresh failed. The last valid checked-in snapshot will be deployed with its partial/stale status and blank unverified values intact." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate published snapshot
        run: python scripts/validate_snapshot.py
      - name: Recheck static pages
        run: python scripts/check_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
