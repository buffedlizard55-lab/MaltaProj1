name: Public source discovery

on:
  push:
    branches: [arena/4f599d7c-maltaproj1]
    paths:
      - scripts/discover_sources.py
      - .github/workflows/discover.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-source-discovery
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ordinary browser tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect public pages and their first-party network data
        run: python scripts/discover_sources.py
      - name: Keep source evidence outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-discovery
          path: .cache/discovery/
          retention-days: 7
      - name: Return small public parser evidence on the session branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/discovery-index.json research/discovery.tar.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: return public parser evidence from run ${{ github.run_id }}"
          git pull --rebase origin main
          git pull --rebase origin arena/4f599d7c-maltaproj1
          git push origin HEAD:arena/4f599d7c-maltaproj1
