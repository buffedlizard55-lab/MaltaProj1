# TEMPORARY diagnostics for session arena/5545dbb8 — deleted before the pull request.
name: diag-5545dbb8
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/5545dbb8-maltaproj1"]
    paths: [".github/workflows/diag-5545dbb8.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Probe round 3
        run: |
          python3 - > /tmp/probe.txt 2>&1 <<'PY'
          import json, re, urllib.request, urllib.error

          HONEST = "Mozilla/5.0 (compatible; MaltaProj1-executive/1.0; +https://github.com/buffedlizard55-lab/MaltaProj1)"
          BROWSER = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          KEY = "CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R"
          base = "https://guest.api.arcadia.pinnacle.com/0.1"
          pin = {"X-API-Key": KEY, "Accept": "application/json", "Origin": "https://www.pinnacle.com",
                 "Referer": "https://www.pinnacle.com/", "User-Agent": BROWSER}

          def fetch(url, headers=None):
              hdrs = {"User-Agent": HONEST, "Accept": "*/*"}
              if headers:
                  hdrs.update(headers)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=hdrs), timeout=60) as r:
                      return r.status, r.read(20_000_000)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(300)
              except Exception as e:
                  return 0, f"{type(e).__name__}: {e}".encode()

          print("=== PINNACLE join: sport matchups + sport straight markets ===")
          st1, matchups_raw = fetch(f"{base}/sports/12/matchups", pin)
          st2, markets_raw = fetch(f"{base}/sports/12/markets/straight?primaryOnly=false&withSpecials=false", pin)
          print(f"matchups {st1} bytes={len(matchups_raw)}  markets {st2} bytes={len(markets_raw)}")
          matchups = json.loads(matchups_raw) if st1 == 200 else []
          markets = json.loads(markets_raw) if st2 == 200 else []
          cs2 = {m["id"]: m for m in matchups if str((m.get("league") or {}).get("name", "")).startswith("CS2 - ")}
          print(f"CS2 matchups: {len(cs2)}  markets total: {len(markets)}")
          picked = 0
          for market in markets:
              if market.get("type") != "moneyline" or market.get("period") != 0 or market.get("isAlternate") is not False:
                  continue
              if market.get("status") != "open" or market.get("matchupId") not in cs2:
                  continue
              picks = {p.get("designation"): p.get("price") for p in market.get("prices") or []}
              if set(picks) != {"home", "away"}:
                  continue
              m = cs2[market["matchupId"]]
              names = {p.get("alignment"): p.get("name") for p in m.get("participants") or []}
              picked += 1
              if picked <= 6:
                  print(f"   {names.get('home')} vs {names.get('away')} | start {m.get('startTime')} | "
                        f"{picks['home']}/{picks['away']} | bestOfX={m.get('bestOfX')} | status={m.get('status')}")
          print(f"CS2 moneyline quotes joined: {picked}")

          print("=== BO3.GG API shape ===")
          st, raw = fetch("https://api.bo3.gg/api/v1/matches?page[limit]=5&sort=start_date&filter[game]=cs2",
                          {"Accept": "application/json", "User-Agent": BROWSER})
          print(f"matches: {st} bytes={len(raw)}")
          if st == 200:
              data = json.loads(raw)
              items = data.get("results") or data.get("data") or data
              first = items[0] if isinstance(items, list) and items else {}
              print("   top-level keys:", list(data.keys())[:8])
              print("   match keys:", sorted(first.keys())[:40])
              print("   sample:", json.dumps({k: first.get(k) for k in ("id", "name", "slug", "start_date", "status", "tournament", "teams")}, default=str)[:900])
              for key in ("betting", "odds", "bookmakers", "markets"):
                  if key in first:
                      print(f"   {key}:", json.dumps(first[key], default=str)[:600])

          print("=== HLTV individual match page ===")
          st, raw = fetch("https://www.hltv.org/matches/2399384/9z-vs-aurora-thunderpick-world-championship-2026",
                          {"Accept-Language": "en-US,en;q=0.9"})
          html = raw.decode("utf-8", "replace")
          print(f"match page: {st} bytes={len(html)} title={'Just a moment' in html}")
          if st == 200:
              print("   team links:", sorted(set(re.findall(r'href="/team/(\d+)/([^"]+)"', html)))[:6])
              print("   vrs badge text:", re.findall(r"VRS[^<]{0,40}", html)[:4])
              plain = re.sub(r"<[^>]+>", " ", html)
              print("   best-of text:", re.findall(r"Best of \d", plain)[:2])

          print("=== HLTV team page: locate one fixture by kickoff ===")
          for team_id, slug in ((9996, "9z"), (11861, "aurora")):
              st, raw = fetch(f"https://www.hltv.org/team/{team_id}/{slug}", {"Accept-Language": "en-US,en;q=0.9"})
              html = raw.decode("utf-8", "replace")
              found = []
              for m in re.finditer(r'href="(/matches/(\d+)/([a-z0-9\-]+))"', html):
                  window = html[max(0, m.start() - 1200): m.end() + 1200]
                  stamps = re.findall(r'data-unix="(\d{13})"', window)
                  if any(1789_000_000_000 <= int(s) <= 1792_000_000_000 for s in stamps):
                      found.append((m.group(1), stamps[:2]))
              print(f"   team {team_id}: status={st} future-ish match links={found[:5]}")
          PY
          cat /tmp/probe.txt

      - name: Publish the probe result as a file in this branch
        run: |
          set -euo pipefail
          { echo "# Endpoint probe (temporary file, deleted before the pull request)"; echo; echo '```'; cat /tmp/probe.txt; echo '```'; } > diag-5545dbb8.md
          git config user.name "arena-5545dbb8"
          git config user.email "arena-5545dbb8@users.noreply.github.com"
          git add diag-5545dbb8.md
          git commit -m "diag(5545dbb8): probe results"
          git pull --rebase=merges origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
