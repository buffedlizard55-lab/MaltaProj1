# TEMPORARY diagnostics for session arena/5545dbb8 — deleted before the pull request.
name: diag-5545dbb8
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/5545dbb8-maltaproj1"]
    paths: [".github/workflows/diag-5545dbb8.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe source endpoints with variants
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          HONEST = "Mozilla/5.0 (compatible; MaltaProj1-executive/1.0; +https://github.com/buffedlizard55-lab/MaltaProj1)"
          BROWSER = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          KEY = "CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R"

          def get(url, headers=None, label=""):
              hdrs = {"User-Agent": HONEST, "Accept": "*/*"}
              if headers:
                  hdrs.update(headers)
              req = urllib.request.Request(url, headers=hdrs)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(400)
                      print(f"{label or url}: {r.status} bytes={len(body)} head={body[:120]!r}")
              except urllib.error.HTTPError as e:
                  print(f"{label or url}: HTTPError {e.code} body={e.read(200)[:160]!r}")
              except Exception as e:
                  print(f"{label or url}: {type(e).__name__} {e}")

          print("=== PINNACLE ===")
          base = "https://guest.api.arcadia.pinnacle.com/0.1"
          pin = {"X-API-Key": KEY, "Accept": "application/json", "Origin": "https://www.pinnacle.com",
                 "Referer": "https://www.pinnacle.com/"}
          get(f"{base}/sports/12/matchups?withSpecials=false", pin, "sport matchups (key+origin)")
          get(f"{base}/sports/12/matchups?withSpecials=false", {"X-API-Key": KEY}, "sport matchups (key only)")
          get(f"{base}/sports/12/matchups?withSpecials=false", None, "sport matchups (no key)")
          get(f"{base}/sports/12/matchups?withSpecials=false", {**pin, "User-Agent": BROWSER}, "sport matchups (browser UA)")
          get(f"{base}/sports/12/markets/straight?primaryOnly=false&withSpecials=false", pin, "sport straight markets")
          get(f"{base}/sports/12/leagues?all=false", pin, "leagues")
          # league ids learned from the leagues call are printed so the next attempt is exact
          for lid in (230488, 293370, 230242):
              get(f"{base}/leagues/{lid}/matchups", pin, f"league {lid} matchups plain")
              get(f"{base}/leagues/{lid}/matchups?withSpecials=false", pin, f"league {lid} matchups query")

          print("=== HLTV ===")
          for path in ("/matches", "/matches?offset=0", "/events/matches", "/results?offset=0"):
              get("https://www.hltv.org" + path, {"User-Agent": HONEST, "Accept-Language": "en-US,en;q=0.9"}, f"honest {path}")
              get("https://www.hltv.org" + path, {"User-Agent": BROWSER, "Accept-Language": "en-US,en;q=0.9"}, f"browser {path}")
          get("https://www.hltv.org/team/5991/envy", {"User-Agent": BROWSER}, "team page (browser UA)")
          get("https://www.hltv.org/team/5991/envy", {"User-Agent": HONEST}, "team page (honest UA)")

          print("=== EGAMERSWORLD ===")
          get("https://egamersworld.com/counterstrike/matches", {"User-Agent": BROWSER, "Accept-Language": "en-US,en;q=0.9"}, "egw browser UA")
          get("https://egamersworld.com/counterstrike/matches", {"User-Agent": HONEST}, "egw honest UA")
          PY
