# TEMPORARY diagnostics for session arena/5545dbb8 — deleted before the pull request.
name: diag-5545dbb8
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/5545dbb8-maltaproj1"]
    paths: [".github/workflows/diag-5545dbb8.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Probe round 2
        run: |
          python3 - > /tmp/probe.txt 2>&1 <<'PY'
          import json, re, urllib.request, urllib.error

          HONEST = "Mozilla/5.0 (compatible; MaltaProj1-executive/1.0; +https://github.com/buffedlizard55-lab/MaltaProj1)"
          BROWSER = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          KEY = "CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R"
          base = "https://guest.api.arcadia.pinnacle.com/0.1"
          pin = {"X-API-Key": KEY, "Accept": "application/json", "Origin": "https://www.pinnacle.com",
                 "Referer": "https://www.pinnacle.com/", "User-Agent": BROWSER}

          def body(url, headers=None, n=400):
              hdrs = {"User-Agent": HONEST, "Accept": "*/*"}
              if headers:
                  hdrs.update(headers)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=hdrs), timeout=45) as r:
                      data = r.read(12_000_000)
                      return r.status, data
              except urllib.error.HTTPError as e:
                  return e.code, e.read(300)
              except Exception as e:
                  return 0, f"{type(e).__name__}: {e}".encode()

          def show(label, url, headers=None, pattern=None):
              status, data = body(url, headers)
              note = ""
              if status == 200 and pattern:
                  found = re.findall(pattern, data.decode("utf-8", "replace"))
                  note = f" matches={len(found)} sample={found[:3]}"
              print(f"{label}: {status} bytes={len(data)}{note}")
              return status, data

          print("=== PINNACLE per-matchup markets ===")
          status, data = body(f"{base}/sports/12/matchups", pin)
          matchups = json.loads(data) if status == 200 else []
          cs2 = [m for m in matchups if str((m.get("league") or {}).get("name", "")).startswith("CS2 - ")]
          print(f"CS2 matchups in sport list: {len(cs2)}")
          ids = [m.get("id") for m in cs2][:3]
          for mid in ids:
              show(f"markets plain {mid}", f"{base}/matchups/{mid}/markets/related/straight", pin)
              show(f"markets query {mid}", f"{base}/matchups/{mid}/markets/related/straight?primary=false", pin)
          show("sport straight markets size", f"{base}/sports/12/markets/straight?primaryOnly=false&withSpecials=false", pin)

          print("=== HLTV team page: upcoming-match links ===")
          status, data = body("https://www.hltv.org/team/5991/envy", {"Accept-Language": "en-US,en;q=0.9"})
          html = data.decode("utf-8", "replace")
          links = re.findall(r'href="(/matches/(\d+)/([a-z0-9\-]+))"', html)
          print(f"team page: {status} bytes={len(html)} match_links={len(set(links))} sample={sorted(set(links))[:3]}")
          unix = re.findall(r'data-unix="(\d{13})"', html)
          print(f"   data-unix stamps: {len(unix)}")
          show("hltv results page", "https://www.hltv.org/results", {"Accept-Language": "en-US,en;q=0.9"}, r'href="/matches/(\d+)/')

          print("=== other esports market sources (US runner) ===")
          for label, url in [
              ("oddspedia cs", "https://oddspedia.com/esports/counter-strike"),
              ("oddsdigger esports", "https://www.oddsdigger.com/esports"),
              ("oddsdigger cs2", "https://www.oddsdigger.com/othersports/cs2"),
              ("tips.gg cs", "https://tips.gg/matches/counter-strike/"),
              ("bo3.gg matches", "https://bo3.gg/matches"),
              ("bo3.gg api", "https://api.bo3.gg/api/v1/matches?page[limit]=20&sort=start_date&filter[game]=cs2"),
              ("escharts api", "https://escharts.com/api/matches?game=counter-strike"),
              ("cyber.sports.ru", "https://cyber.sports.ru/cs/"),
              ("egamersworld cs (browser)", "https://egamersworld.com/counterstrike/matches"),
              ("hltv events", "https://www.hltv.org/events/9442/cct-2026-europe-series-11"),
          ]:
              show(label, url, {"User-Agent": BROWSER, "Accept-Language": "en-US,en;q=0.9"})
          PY
          cat /tmp/probe.txt

      - name: Publish the probe result as a file in this branch
        run: |
          set -euo pipefail
          { echo "# Endpoint probe (temporary file, deleted before the pull request)"; echo; echo '```'; cat /tmp/probe.txt; echo '```'; } > diag-5545dbb8.md
          git config user.name "arena-5545dbb8"
          git config user.email "arena-5545dbb8@users.noreply.github.com"
          git add diag-5545dbb8.md
          git commit -m "diag(5545dbb8): probe results"
          git pull --rebase=merges origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
