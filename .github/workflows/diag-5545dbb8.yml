# TEMPORARY diagnostics for session arena/5545dbb8 — deleted before the pull request.
name: diag-5545dbb8
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/5545dbb8-maltaproj1"]
    paths: [".github/workflows/diag-5545dbb8.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Probe round 4
        run: |
          python3 - > /tmp/probe.txt 2>&1 <<'PY'
          import json, re, urllib.request, urllib.error
          HONEST = "Mozilla/5.0 (compatible; MaltaProj1-executive/1.0; +https://github.com/buffedlizard55-lab/MaltaProj1)"
          BROWSER = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          def fetch(url, headers=None):
              hdrs = {"User-Agent": BROWSER, "Accept": "*/*", "Accept-Language": "en-US,en;q=0.9"}
              if headers:
                  hdrs.update(headers)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=hdrs), timeout=45) as r:
                      return r.status, r.read(6_000_000)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(200)
              except Exception as e:
                  return 0, f"{type(e).__name__}: {e}".encode()

          def show(label, url, headers=None, pattern=None):
              st, data = fetch(url, headers)
              note = ""
              if st == 200 and pattern:
                  found = re.findall(pattern, data.decode("utf-8", "replace"))
                  note = f" hits={len(found)} sample={found[:3]}"
              print(f"{label}: {st} bytes={len(data)}{note}")
              return data

          print("=== other odds sources ===")
          for label, url in [
              ("oddspedia api", "https://oddspedia.com/api/v1/getMatchList?sport=counter-strike&limit=20"),
              ("oddsdigger cs", "https://www.oddsdigger.com/esports/counter-strike"),
              ("gg.bet cs2", "https://gg.bet/en/counter-strike"),
              ("loot.bet cs", "https://loot.bet/esports/csgo"),
              ("thunderpick cs", "https://thunderpick.io/esports/cs2"),
              ("betway esports", "https://sports.betway.com/api/events/csgo"),
              ("csgopositive", "https://csgopositive.com/"),
              ("egb cs", "https://egamersworld.com/counterstrike/matches"),
          ]:
              show(label, url)

          print("=== bo3.gg odds endpoints ===")
          raw = show("bo3 upcoming", "https://api.bo3.gg/api/v1/matches?page[limit]=10&sort=-start_date&filter[game]=cs2&filter[status]=upcoming",
                     {"Accept": "application/json"})
          try:
              data = json.loads(raw)
              items = data.get("results", [])
              print("   upcoming count:", len(items), "total:", data.get("total"))
              if items:
                  mid = items[0]["id"]
                  print("   sample:", json.dumps({k: items[0].get(k) for k in ("id", "slug", "start_date", "status", "bet_updates")}, default=str)[:400])
                  for suffix in (f"/api/v1/matches/{mid}?with=odds", f"/api/v1/matches/{mid}", f"/api/v1/matches/{mid}/odds",
                                 f"/api/v1/matches/{mid}?include=bookmakers"):
                      st, body = fetch("https://api.bo3.gg" + suffix, {"Accept": "application/json"})
                      keys = ""
                      if st == 200:
                          try:
                              obj = json.loads(body)
                              keys = ",".join(sorted((obj.get("results") or obj).keys())[:25]) if isinstance(obj, dict) else "list"
                          except Exception:
                              keys = "unparsed"
                      print(f"   {suffix}: {st} bytes={len(body)} keys={keys[:200]}")

          print("=== pinnacle: which CS2 matchups carry an open moneyline ===")
          KEY = "CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R"
          pin = {"X-API-Key": KEY, "Accept": "application/json", "Origin": "https://www.pinnacle.com",
                 "Referer": "https://www.pinnacle.com/", "User-Agent": BROWSER}
          base = "https://guest.api.arcadia.pinnacle.com/0.1"
          st, mraw = fetch(f"{base}/sports/12/matchups", pin)
          st2, kraw = fetch(f"{base}/sports/12/markets/straight?primaryOnly=false&withSpecials=false", pin)
          cs2 = {m["id"]: m for m in json.loads(mraw) if str((m.get("league") or {}).get("name", "")).startswith("CS2 - ")}
          print("   CS2 matchups:", len(cs2), "leagues:", sorted({(m.get("league") or {}).get("name") for m in cs2.values()}))
          quotes = 0
          for market in json.loads(kraw):
              if market.get("matchupId") in cs2 and market.get("type") == "moneyline" and market.get("period") == 0 \
                 and market.get("isAlternate") is False and market.get("status") == "open":
                  quotes += 1
          print("   open CS2 moneylines in the sport-wide market list:", quotes)
          PY
          cat /tmp/probe.txt

      - name: Publish the probe result as a file in this branch
        run: |
          set -euo pipefail
          { echo "# Endpoint probe (temporary file, deleted before the pull request)"; echo; echo '```'; cat /tmp/probe.txt; echo '```'; } > diag-5545dbb8.md
          git config user.name "arena-5545dbb8"
          git config user.email "arena-5545dbb8@users.noreply.github.com"
          git add diag-5545dbb8.md
          git commit -m "diag(5545dbb8): probe results"
          git pull --rebase=merges origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
