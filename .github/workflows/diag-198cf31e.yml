name: Diag probe (198cf31e, temporary)

on:
  push:
    branches: ["arena/198cf31e-maltaproj1"]
    paths: ["briefing/**", ".github/workflows/diag-198cf31e.yml"]

permissions:
  contents: write

concurrency:
  group: diag-198cf31e
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect
        continue-on-error: true
        run: python briefing/collect.py
      - name: Probe structure
        run: python briefing/probe.py
      - name: Commit probe
        run: |
          git config user.name "arena-198cf31e"
          git config user.email "arena-198cf31e@users.noreply.github.com"
          git add briefing/PROBE.md
          git diff --cached --quiet && echo "probe unchanged" && exit 0
          git commit -m "diag(198cf31e): structural probe"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
