# Every-match Hotspawn CS2 board — automatic refresh (session arena/22be6967).
#
# Every 3 hours (so the board stays inside the 4-8 h freshness requirement even if GitHub drops one
# scheduled run), with no credentials and no manual input:
#   1. read all three Hotspawn CS2 surfaces (TransferState), Pinnacle's public guest JSON, Polymarket,
#      Valve's official standings (cloned) and HLTV's ranking;
#   2. refit our own line's slope on Valve's published results;
#   3. originate a pick + both probabilities for every open match, the leaderboard plan and the flags;
#   4. rebuild hotspawn/*.html, run hotspawn/tests.py and a headless phone-layout check;
#   5. commit data + pages ONLY when the checks pass (otherwise the last good pages stay published and
#      this run is red so the failure is visible).
name: Hotspawn every-match board (22be6967)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "29 */3 * * *"
  push:
    branches: ["main", "arena/22be6967-maltaproj1"]
    paths:
      - "hotspawn/*.py"
      - "hotspawn/research/**"
      - "hotspawn/style.css"
      - ".github/workflows/hotspawn-22be6967.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: hotspawn-22be6967-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Valve's official Regional Standings (points, rosters, match history)
        run: |
          git clone -q --depth 1 https://github.com/ValveSoftware/counter-strike_regional_standings "$RUNNER_TEMP/vrs"
          echo "VRS_REPO_DIR=$RUNNER_TEMP/vrs" >> "$GITHUB_ENV"
          echo "VRS_COMMIT=$(git -C "$RUNNER_TEMP/vrs" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Collect Hotspawn, Pinnacle, Polymarket, Valve, HLTV
        run: python3 -u hotspawn/collect.py

      - name: Fit our own line on Valve's published results
        run: python3 -u hotspawn/calibrate.py

      - name: Originate picks, probabilities and the leaderboard plan
        run: python3 -u hotspawn/model.py

      - name: Build the pages
        run: python3 -u hotspawn/build.py

      - name: Invariants (probabilities, crowd isolation, sources, links)
        id: tests
        run: python3 -u hotspawn/tests.py

      - name: Install a headless browser for the phone-layout check
        id: browser
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Phone-layout check (390x844, no horizontal overflow)
        id: mobile
        run: python3 -u hotspawn/mobile_check.py

      - name: Commit the refreshed board
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git config user.name "hotspawn-22be6967[bot]"
          git config user.email "hotspawn-22be6967@users.noreply.github.com"
          git add -A hotspawn/data hotspawn/*.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "hotspawn(22be6967): refresh every-match board [skip ci] [run ${GITHUB_RUN_ID}]"
          is_generated() { case "$1" in hotspawn/data/*|hotspawn/*.html) return 0 ;; *) return 1 ;; esac; }
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin "$BR"; then
              git push -q origin "HEAD:$BR" && { echo "pushed to $BR"; exit 0; }
            else
              conflicts=$(git diff --name-only --diff-filter=U || true)
              foreign=0
              for f in $conflicts; do is_generated "$f" || foreign=1; done
              if [ -n "$conflicts" ] && [ "$foreign" = 0 ]; then
                git checkout --theirs -- $conflicts && git add -A $conflicts
                GIT_EDITOR=true git rebase --continue || true
                git push -q origin "HEAD:$BR" && { echo "pushed after regenerating"; exit 0; }
              fi
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 10))
          done
          echo "::warning::could not push this refresh; the next scheduled run starts from the newer tip"

      - name: Ask GitHub Pages to rebuild (main only, best effort)
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "pages build request: HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: Run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("hotspawn/data/summary.json")
          if not p.exists():
              print("No summary produced; the published board is unchanged."); raise SystemExit(0)
          s = json.loads(p.read_text())
          print("## Hotspawn every-match board")
          print(f"* Hotspawn read `{s['reference_utc']}` · open {s['open']} · with pick {s['open_with_pick']} · rungs {s['open_rung']}")
          print(f"* leaderboard classes {s['leaderboard_classes']}")
          print(f"* sources {s['sources']} · own-line k {s['own_line_k']} ({s['own_line_k_source']})")
          m = pathlib.Path("hotspawn/data/mobile_check.json")
          if m.exists():
              print(f"* phone check: {json.loads(m.read_text()).get('status')}")
          PY
