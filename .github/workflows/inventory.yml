name: Build pick'em fixture inventory

on:
  push:
    branches: [arena/79a1c6c8-maltaproj1]
    paths:
      - pipeline/inventory.py
      - .github/workflows/inventory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maltaproj1-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build inventory
        run: |
          mkdir -p pipeline/_scratch
          python pipeline/inventory.py 2>&1 | tee pipeline/_scratch/ci-inventory.log
      - name: Commit inventory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f inventory pipeline/_scratch/ci-inventory.log
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: rebuild pick'em fixture inventory [run ${{ github.run_id }}]"
            git pull --rebase origin arena/79a1c6c8-maltaproj1
            git push
          fi
